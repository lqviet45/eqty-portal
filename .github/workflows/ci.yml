name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Static export has every screen
        run: |
          for page in dashboard cap-table stakeholders transactions equity ledger import members settings portfolio grants/new companies companies/new invite auth/callback; do
            test -f "out/$page/index.html" || { echo "missing out/$page/index.html"; exit 1; }
          done
